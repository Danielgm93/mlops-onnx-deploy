name: CI/CD - MLOps ONNX Deploy

on:
  push:
    branches: [ "dev", "prod" ]

env:
  # ==== Parámetros de proyecto ====
  PROJECT_NAME: "mlops-daniel"                  # <= mismo project_name que en terraform.tfvars
  AWS_REGION: ${{ secrets.AWS_REGION }}         # us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }} # tu cuenta
  ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }} # mlops-daniel-onnx-api

  # ==== Rutas de modelo y test data en S3 (buckets creados por Terraform) ====
  MODEL_S3_BUCKET: ${{ secrets.S3_MODEL_BUCKET }}         # mlops-daniel-model-bucket
  MODEL_S3_KEY:    ${{ secrets.S3_MODEL_KEY }}            # models/current/model.onnx
  TEST_DATA_S3_BUCKET: ${{ secrets.S3_TESTDATA_BUCKET }}  # mlops-daniel-model-bucket
  TEST_DATA_S3_KEY:    ${{ secrets.S3_TESTDATA_KEY }}     # test-data/test_data.json

  # ==== Config de tests ====
  MIN_ACCEPTABLE_ACCURACY: "0.15"
  LOCAL_MODEL_PATH: "models/model.onnx"
  TEST_DATA_LOCAL_PATH: "tests_data/test_data.json"

jobs:
  test:
    name: Test ONNX model and metric
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (app + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download ONNX model from S3
        run: |
          mkdir -p "$(dirname "${LOCAL_MODEL_PATH}")"
          aws s3 cp "s3://${MODEL_S3_BUCKET}/${MODEL_S3_KEY}" "${LOCAL_MODEL_PATH}"

      - name: Download test data from S3
        run: |
          mkdir -p "$(dirname "${TEST_DATA_LOCAL_PATH}")"
          aws s3 cp "s3://${TEST_DATA_S3_BUCKET}/${TEST_DATA_S3_KEY}" "${TEST_DATA_LOCAL_PATH}"

      - name: Run tests
        env:
          LOCAL_MODEL_PATH: ${{ env.LOCAL_MODEL_PATH }}
          TEST_DATA_LOCAL_PATH: ${{ env.TEST_DATA_LOCAL_PATH }}
          MIN_ACCEPTABLE_ACCURACY: ${{ env.MIN_ACCEPTABLE_ACCURACY }}
        run: |
          pytest -v

  build_and_deploy:
    name: Build Docker image and deploy to ECS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive cluster and service names from PROJECT_NAME and branch
        id: setenv
        run: |
          PROJECT_NAME="${PROJECT_NAME:-mlops-daniel}"
          BRANCH="${GITHUB_REF##*/}"

          # cluster: <project_name>-onnx-cluster  (coincide con Terraform)
          CLUSTER_NAME="${PROJECT_NAME}-onnx-cluster"

          if [[ "$BRANCH" == "prod" ]]; then
            ECS_SERVICE_NAME="${PROJECT_NAME}-onnx-prod"
            ENV_NAME="prod"
          else
            ECS_SERVICE_NAME="${PROJECT_NAME}-onnx-dev"
            ENV_NAME="dev"
          fi

          echo "cluster_name=${CLUSTER_NAME}"       >> "$GITHUB_OUTPUT"
          echo "ecs_service_name=${ECS_SERVICE_NAME}" >> "$GITHUB_OUTPUT"
          echo "env_name=${ENV_NAME}"               >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY_NAME }}
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"

          echo "Building image ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .

          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Update ECS service task definition
        env:
          CLUSTER_NAME:    ${{ steps.setenv.outputs.cluster_name }}
          ECS_SERVICE_NAME: ${{ steps.setenv.outputs.ecs_service_name }}
          IMAGE_URI:       ${{ steps.build-image.outputs.image_uri }}
        run: |
          echo "Updating ECS service '${ECS_SERVICE_NAME}' in cluster '${CLUSTER_NAME}' with image ${IMAGE_URI}"

          # Obtener task definition actual
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${CLUSTER_NAME}" \
            --services "${ECS_SERVICE_NAME}" \
            --query "services[0].taskDefinition" \
            --output text)

          echo "Current task definition ARN: ${TASK_DEF_ARN}"

          # Describir task definition actual
          aws ecs describe-task-definition \
            --task-definition "${TASK_DEF_ARN}" \
            --query "taskDefinition" \
            --output json > task-def.json

          # Strip campos que no se pueden enviar a register-task-definition
          cat task-def.json \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredBy, .registeredAt)' \
            > task-def-stripped.json

          # Actualizar imagen (primer contenedor)
          cat task-def-stripped.json \
            | jq ".containerDefinitions[0].image = \"${IMAGE_URI}\"" \
            > task-def-updated.json

          # Registrar nueva revisión
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-updated.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "New task definition ARN: ${NEW_TASK_DEF_ARN}"

          # Actualizar servicio para usar la nueva task definition
          aws ecs update-service \
            --cluster "${CLUSTER_NAME}" \
            --service "${ECS_SERVICE_NAME}" \
            --task-definition "${NEW_TASK_DEF_ARN}" \
            --force-new-deployment

          echo "ECS service update triggered."
